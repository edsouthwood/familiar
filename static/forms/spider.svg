<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-labelledby="t">
<title id="t">Spider</title>
<!-- One of the fifteen forms the find familiar spell allows. See
     static/forms/README.md for the collection and how to put one on a page.
     Stroked in currentColor: inlined in a document it takes the colour of the
     text around it, and used as a CSS mask it takes whatever is painted
     behind it. -->
<style>
  path, circle { fill: none; stroke: currentColor; stroke-width: 2.2;
                  stroke-linecap: round; stroke-linejoin: round; }
</style>
  <g id="f-spider">
    <circle cx="32" cy="37" r="9"/>
    <circle cx="32" cy="24" r="6"/>
    <path d="M37 21 L47 13 L56 17"/>
    <path d="M38 25 L49 21 L58 27"/>
    <path d="M38 30 L48 31 L56 39"/>
    <path d="M37 33 L45 39 L49 48"/>
  </g>
  <use href="#f-spider" transform="translate(64,0) scale(-1,1)"/>
</svg>
