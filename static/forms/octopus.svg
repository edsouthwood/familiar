<title id="t">Octopus</title>
<!-- One of the fifteen forms the find familiar spell allows. See
     static/forms/README.md for the collection and how to put one on a page.
     Stroked in currentColor: inlined in a document it takes the colour of the
     text around it, and used as a CSS mask it takes whatever is painted
     behind it. -->
