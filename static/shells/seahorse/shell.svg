<svg xmlns="http://www.w3.org/2000/svg" id="familiar" viewBox="0 0 400 400" aria-label="Sea horse familiar">

  <style>
    /* What this creature looks like at rest.
     *
     * Inside the drawing rather than in shell.css beside it, because a shell
     * has to be right opened on its own -- in an &lt;img&gt;, in a browser tab,
     * in the shape picker on the hub -- and none of those load the stylesheet.
     * Without it a familiar renders with its closed eyes drawn on top of its
     * open ones, its mouth hanging open and its sleeping z's in the air.
     *
     * shell.css still wins wherever it has an opinion: every rule there is
     * prefixed with body[data-state=...], which outranks a bare selector. */
    .eyelid { transform: scaleY(0); }
    #closed-eyes, #sparkles, #zzz, #bubbles, #tongue { opacity: 0; }
    #mouth-open { visibility: hidden; }
  </style>

  <g id="fin-dorsal">
    <path class="edge" d="M 178 196 C 138 210, 124 262, 136 306 C 158 280, 174 240, 182 212 Z"
          fill="#f0b840" opacity="0.92"/>
  </g>

  <g id="tail">
    <path d="M 196 292 C 186 322, 198 348, 226 350 C 254 352, 270 330, 258 310
             C 248 294, 226 294, 220 310 C 216 322, 226 330, 234 326"
          stroke="#f5c95e" stroke-width="34" fill="none" stroke-linecap="round"/>
  </g>

  <path d="M 206 148 C 246 148, 262 176, 254 212 C 246 248, 218 264, 204 296"
        stroke="#f5c95e" stroke-width="52" fill="none" stroke-linecap="round"/>
  <path d="M 208 160 C 238 160, 250 182, 242 212 C 234 242, 212 258, 200 288"
        stroke="#fbe3a6" stroke-width="18" fill="none" stroke-linecap="round"/>
  <g fill="#e0a52c" opacity="0.7">
    <ellipse cx="238" cy="186" rx="10" ry="6" transform="rotate(-24 238 186)"/>
    <ellipse cx="234" cy="216" rx="10" ry="6" transform="rotate(-40 234 216)"/>
    <ellipse cx="220" cy="246" rx="10" ry="6" transform="rotate(-56 220 246)"/>
    <ellipse cx="208" cy="276" rx="10" ry="6" transform="rotate(-70 208 276)"/>
  </g>

  <g id="head">
    <g id="coronet">
      <path class="edge" d="M 190 116 L 178 66 L 202 92 L 214 52 L 230 92 L 252 68 L 244 118 Z"
            fill="#f0b840"/>
    </g>
    <path class="edge" d="M 216 104 C 254 104, 276 128, 274 158 C 272 186, 250 202, 220 202
             C 190 202, 174 182, 174 152 C 174 122, 190 104, 216 104 Z"
          fill="#f5c95e"/>
    <path class="edge" d="M 266 140 C 294 138, 330 148, 338 160 C 342 168, 326 180, 300 180
             C 280 180, 266 166, 264 154 Z" fill="#f5c95e"/>
    <path d="M 272 152 C 296 150, 322 158, 330 164" stroke="#e0a52c"
          stroke-width="4" fill="none" stroke-linecap="round"/>
  <g class="eye" id="eye-left">
    <circle cx="224" cy="146" r="21" fill="#ffffff"/>
    <circle cx="224" cy="146" r="14" fill="#4a7fa8"/>
    <g class="pupil">
      <ellipse cx="224" cy="146" rx="9" ry="9" fill="#14101f"/>
      <circle cx="228" cy="140" r="3" fill="#fff"/>
    </g>
    <circle class="eyelid" cx="224" cy="146" r="22" fill="#f5c95e"/>
  </g>
  <g id="closed-eyes" stroke="#c08a1e" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 203 146 Q 224 159 245 146"/>
  </g>
    <g id="mouth-closed">
      <ellipse cx="336" cy="168" rx="10" ry="8" fill="#c08a1e"/>
    </g>
    <g id="mouth-open">
      <ellipse cx="338" cy="172" rx="13" ry="13" fill="#a8452e"/>
    </g>
  </g>

  <g id="bubbles" fill="#bfe4f5" opacity="0.9">
    <circle class="bub b1" cx="374" cy="132" r="9"/>
    <circle class="bub b2" cx="356" cy="96"  r="6"/>
    <circle class="bub b3" cx="368" cy="60"  r="4"/>
  </g>

  <g id="sparkles" fill="#ffd97a">
    <path class="spark s1" d="M 322 74 l 4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
    <path class="spark s2" d="M 352 114 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
    <path class="spark s3" d="M 298 46 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
  </g>

  <g id="zzz" fill="#b592ff" font-family="Georgia, serif" font-weight="bold">
    <text class="z z1" x="296" y="96"  font-size="34">z</text>
    <text class="z z2" x="322" y="68"  font-size="26">z</text>
    <text class="z z3" x="344" y="46"  font-size="19">z</text>
  </g>
</svg>
