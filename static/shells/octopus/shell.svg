<svg xmlns="http://www.w3.org/2000/svg" id="familiar" viewBox="0 0 400 400" aria-label="Octopus familiar">

  <style>
    /* What this creature looks like at rest.
     *
     * Inside the drawing rather than in shell.css beside it, because a shell
     * has to be right opened on its own -- in an &lt;img&gt;, in a browser tab,
     * in the shape picker on the hub -- and none of those load the stylesheet.
     * Without it a familiar renders with its closed eyes drawn on top of its
     * open ones, its mouth hanging open and its sleeping z's in the air.
     *
     * shell.css still wins wherever it has an opinion: every rule there is
     * prefixed with body[data-state=...], which outranks a bare selector. */
    .eyelid { transform: scaleY(0); }
    #closed-eyes, #sparkles, #zzz, #bubbles, #tongue { opacity: 0; }
    #mouth-open { visibility: hidden; }
  </style>

  <g id="arms">
    <path class="arm a1 edge" d="M 132 268 C 96 292, 78 330, 84 366 C 86 380, 104 380, 106 366
             C 102 338, 116 310, 146 292 Z" fill="#8f5ab8"/>
    <path class="arm a2 edge" d="M 152 288 C 124 320, 116 348, 122 374 C 124 386, 140 386, 142 374
             C 138 350, 148 326, 168 306 Z" fill="#9d68c6"/>
    <path class="arm a3 edge" d="M 176 300 C 160 332, 158 356, 164 378 C 166 390, 182 390, 184 378
             C 180 356, 184 332, 194 312 Z" fill="#8f5ab8"/>
    <path class="arm a4 edge" d="M 198 304 C 194 336, 196 360, 202 380 C 204 392, 218 392, 218 380
             C 216 358, 214 332, 214 312 Z" fill="#9d68c6"/>
  </g>
  <g transform="translate(400,0) scale(-1,1)">
    <g id="arms-mirror">
      <path class="arm a1 edge" d="M 132 268 C 96 292, 78 330, 84 366 C 86 380, 104 380, 106 366
               C 102 338, 116 310, 146 292 Z" fill="#8f5ab8"/>
      <path class="arm a2 edge" d="M 152 288 C 124 320, 116 348, 122 374 C 124 386, 140 386, 142 374
               C 138 350, 148 326, 168 306 Z" fill="#9d68c6"/>
      <path class="arm a3 edge" d="M 176 300 C 160 332, 158 356, 164 378 C 166 390, 182 390, 184 378
               C 180 356, 184 332, 194 312 Z" fill="#8f5ab8"/>
      <path class="arm a4 edge" d="M 198 304 C 194 336, 196 360, 202 380 C 204 392, 218 392, 218 380
               C 216 358, 214 332, 214 312 Z" fill="#9d68c6"/>
    
    </g>
  </g>

  <g id="head">
    <path class="edge" d="M 200 44 C 274 44, 320 106, 320 186 C 320 262, 274 306, 200 306
             C 126 306, 80 262, 80 186 C 80 106, 126 44, 200 44 Z"
          fill="#a874d0"/>
    <path d="M 200 62 C 250 62, 282 100, 288 148 C 252 128, 226 122, 200 122
             C 174 122, 148 128, 112 148 C 118 100, 150 62, 200 62 Z"
          fill="#c093e0"/>
    <g fill="#8f5ab8" opacity="0.8">
      <ellipse cx="140" cy="238" rx="14" ry="9"/><ellipse cx="200" cy="262" rx="16" ry="10"/>
      <ellipse cx="260" cy="238" rx="14" ry="9"/>
    </g>
  <g class="eye" id="eye-left">
    <circle cx="152" cy="196" r="32" fill="#ffffff"/>
    <circle cx="152" cy="196" r="21" fill="#f0d98a"/>
    <g class="pupil">
      <ellipse cx="152" cy="196" rx="12" ry="12" fill="#14101f"/>
      <circle cx="158" cy="189" r="4" fill="#fff"/>
    </g>
    <circle class="eyelid" cx="152" cy="196" r="33" fill="#a874d0"/>
  </g>
  <g class="eye" id="eye-right">
    <circle cx="248" cy="196" r="32" fill="#ffffff"/>
    <circle cx="248" cy="196" r="21" fill="#f0d98a"/>
    <g class="pupil">
      <ellipse cx="248" cy="196" rx="12" ry="12" fill="#14101f"/>
      <circle cx="254" cy="189" r="4" fill="#fff"/>
    </g>
    <circle class="eyelid" cx="248" cy="196" r="33" fill="#a874d0"/>
  </g>
  <g id="closed-eyes" stroke="#6c3f8e" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 120 196 Q 152 215 184 196"/>
    <path d="M 216 196 Q 248 215 280 196"/>
  </g>
    <g id="mouth-closed" stroke="#6c3f8e" stroke-width="5" fill="none"
       stroke-linecap="round">
      <path d="M 182 250 Q 200 262 218 250"/>
    </g>
    <g id="mouth-open">
      <ellipse cx="200" cy="256" rx="20" ry="15" fill="#5e2f6e"/>
    </g>
  </g>

  <g id="sparkles" fill="#ffd97a">
    <path class="spark s1" d="M 322 74 l 4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
    <path class="spark s2" d="M 352 114 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
    <path class="spark s3" d="M 298 46 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
  </g>

  <g id="zzz" fill="#b592ff" font-family="Georgia, serif" font-weight="bold">
    <text class="z z1" x="296" y="96"  font-size="34">z</text>
    <text class="z z2" x="322" y="68"  font-size="26">z</text>
    <text class="z z3" x="344" y="46"  font-size="19">z</text>
  </g>
</svg>
