<svg xmlns="http://www.w3.org/2000/svg" id="familiar" viewBox="0 0 400 400" aria-label="Frog familiar">

  <style>
    /* What this creature looks like at rest.
     *
     * Inside the drawing rather than in shell.css beside it, because a shell
     * has to be right opened on its own -- in an &lt;img&gt;, in a browser tab,
     * in the shape picker on the hub -- and none of those load the stylesheet.
     * Without it a familiar renders with its closed eyes drawn on top of its
     * open ones, its mouth hanging open and its sleeping z's in the air.
     *
     * shell.css still wins wherever it has an opinion: every rule there is
     * prefixed with body[data-state=...], which outranks a bare selector. */
    .eyelid { transform: scaleY(0); }
    #closed-eyes, #sparkles, #zzz, #bubbles, #tongue { opacity: 0; }
    #mouth-open { visibility: hidden; }
  </style>

  <g id="foot-left">
    <path class="edge" d="M 130 330 C 104 330, 84 342, 78 356 C 96 362, 122 358, 138 348 Z"
          fill="#5f9e3a"/>
  </g>
  <g transform="translate(400,0) scale(-1,1)">
    <g id="foot-right">
      <path class="edge" d="M 130 330 C 104 330, 84 342, 78 356 C 96 362, 122 358, 138 348 Z"
            fill="#5f9e3a"/>
    
    </g>
  </g>

  <ellipse class="edge" cx="200" cy="272" rx="126" ry="86" fill="#6fb545"/>
  <ellipse cx="200" cy="296" rx="86" ry="56" fill="#cfe6a4" id="throat"/>
  <g fill="#4f8a2e" opacity="0.75">
    <ellipse cx="126" cy="240" rx="15" ry="10"/><ellipse cx="272" cy="248" rx="13" ry="9"/>
    <ellipse cx="148" cy="300" rx="12" ry="8"/><ellipse cx="258" cy="304" rx="14" ry="9"/>
  </g>

  <g id="head">
    <ellipse class="edge" cx="200" cy="188" rx="112" ry="76" fill="#6fb545"/>
    <g id="dome-left"><circle class="edge" cx="146" cy="126" r="42" fill="#6fb545"/></g>
    <g id="dome-right"><circle class="edge" cx="254" cy="126" r="42" fill="#6fb545"/></g>
  <g class="eye" id="eye-left">
    <circle cx="146" cy="122" r="30" fill="#ffffff"/>
    <circle cx="146" cy="122" r="20" fill="#e8b830"/>
    <g class="pupil">
      <ellipse cx="146" cy="122" rx="12" ry="12" fill="#14101f"/>
      <circle cx="152" cy="115" r="4" fill="#fff"/>
    </g>
    <circle class="eyelid" cx="146" cy="122" r="31" fill="#6fb545"/>
  </g>
  <g class="eye" id="eye-right">
    <circle cx="254" cy="122" r="30" fill="#ffffff"/>
    <circle cx="254" cy="122" r="20" fill="#e8b830"/>
    <g class="pupil">
      <ellipse cx="254" cy="122" rx="12" ry="12" fill="#14101f"/>
      <circle cx="260" cy="115" r="4" fill="#fff"/>
    </g>
    <circle class="eyelid" cx="254" cy="122" r="31" fill="#6fb545"/>
  </g>
  <g id="closed-eyes" stroke="#4f8a2e" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 116 122 Q 146 140 176 122"/>
    <path d="M 224 122 Q 254 140 284 122"/>
  </g>
    <g id="mouth-closed" stroke="#3f6e24" stroke-width="6" fill="none"
       stroke-linecap="round">
      <path d="M 118 202 Q 200 244 282 202"/>
    </g>
    <g id="mouth-open">
      <path d="M 118 202 Q 200 292 282 202 Q 200 226 118 202 Z" fill="#8f3f4e"/>
      <ellipse cx="200" cy="244" rx="30" ry="14" fill="#d16a78"/>
    </g>
    <g fill="#3f6e24">
      <circle cx="182" cy="176" r="5"/><circle cx="218" cy="176" r="5"/>
    </g>
  </g>

  <g id="sparkles" fill="#ffd97a">
    <path class="spark s1" d="M 322 74 l 4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
    <path class="spark s2" d="M 352 114 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
    <path class="spark s3" d="M 298 46 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
  </g>

  <g id="zzz" fill="#b592ff" font-family="Georgia, serif" font-weight="bold">
    <text class="z z1" x="296" y="96"  font-size="34">z</text>
    <text class="z z2" x="322" y="68"  font-size="26">z</text>
    <text class="z z3" x="344" y="46"  font-size="19">z</text>
  </g>
</svg>
