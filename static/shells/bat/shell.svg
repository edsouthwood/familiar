<svg xmlns="http://www.w3.org/2000/svg" id="familiar" viewBox="0 0 400 400" aria-label="Bat familiar">

  <style>
    /* What this creature looks like at rest.
     *
     * Inside the drawing rather than in shell.css beside it, because a shell
     * has to be right opened on its own -- in an &lt;img&gt;, in a browser tab,
     * in the shape picker on the hub -- and none of those load the stylesheet.
     * Without it a familiar renders with its closed eyes drawn on top of its
     * open ones, its mouth hanging open and its sleeping z's in the air.
     *
     * shell.css still wins wherever it has an opinion: every rule there is
     * prefixed with body[data-state=...], which outranks a bare selector. */
    .eyelid { transform: scaleY(0); }
    #closed-eyes, #sparkles, #zzz, #bubbles, #tongue { opacity: 0; }
    #mouth-open { visibility: hidden; }
  </style>

  <g id="wing-left" class="wing">
    <path class="edge" d="M 152 232 C 96 188, 44 202, 22 254 C 58 248, 70 264, 58 290
             C 94 280, 110 294, 106 322 C 134 294, 150 264, 156 244 Z"
          fill="#56496b"/>
    <path d="M 60 250 L 104 268 M 62 288 L 112 288" stroke="#463a58"
          stroke-width="4" fill="none"/>
  </g>
  <g transform="translate(400,0) scale(-1,1)">
    <g id="wing-right" class="wing">
      <path class="edge" d="M 152 232 C 96 188, 44 202, 22 254 C 58 248, 70 264, 58 290
               C 94 280, 110 294, 106 322 C 134 294, 150 264, 156 244 Z"
            fill="#56496b"/>
      <path d="M 60 250 L 104 268 M 62 288 L 112 288" stroke="#463a58"
            stroke-width="4" fill="none"/>
    
    </g>
  </g>

  <ellipse class="edge" cx="200" cy="272" rx="70" ry="80" fill="#6a5a80"/>
  <ellipse cx="200" cy="286" rx="44" ry="56" fill="#9384ad"/>
  <path d="M 178 346 v 16 M 222 346 v 16" stroke="#c48ba8" stroke-width="8"
        stroke-linecap="round"/>

  <g id="head">
    <g id="ear-left" class="ear">
      <path class="edge" d="M 150 122 C 126 58, 142 28, 172 42 C 184 62, 180 100, 172 124 Z"
            fill="#6a5a80"/>
      <path d="M 155 112 C 141 66, 150 48, 166 56 C 174 70, 171 98, 165 112 Z"
            fill="#c48ba8"/>
    </g>
    <g transform="translate(400,0) scale(-1,1)">
      <g id="ear-right" class="ear">
        <path class="edge" d="M 150 122 C 126 58, 142 28, 172 42 C 184 62, 180 100, 172 124 Z"
              fill="#6a5a80"/>
        <path d="M 155 112 C 141 66, 150 48, 166 56 C 174 70, 171 98, 165 112 Z"
              fill="#c48ba8"/>
      
      </g>
    </g>
    <circle class="edge" cx="200" cy="166" r="76" fill="#6a5a80"/>
    <ellipse cx="200" cy="196" rx="42" ry="34" fill="#7d6d94"/>
  <g class="eye" id="eye-left">
    <circle cx="172" cy="152" r="20" fill="#ffffff"/>
    <circle cx="172" cy="152" r="13" fill="#3a2c4e"/>
    <g class="pupil">
      <ellipse cx="172" cy="152" rx="8" ry="8" fill="#14101f"/>
      <circle cx="176" cy="147" r="3" fill="#fff"/>
    </g>
    <circle class="eyelid" cx="172" cy="152" r="21" fill="#6a5a80"/>
  </g>
  <g class="eye" id="eye-right">
    <circle cx="228" cy="152" r="20" fill="#ffffff"/>
    <circle cx="228" cy="152" r="13" fill="#3a2c4e"/>
    <g class="pupil">
      <ellipse cx="228" cy="152" rx="8" ry="8" fill="#14101f"/>
      <circle cx="232" cy="147" r="3" fill="#fff"/>
    </g>
    <circle class="eyelid" cx="228" cy="152" r="21" fill="#6a5a80"/>
  </g>
  <g id="closed-eyes" stroke="#463a58" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 152 152 Q 172 164 192 152"/>
    <path d="M 208 152 Q 228 164 248 152"/>
  </g>
    <path d="M 200 188 l -9 11 h 18 Z" fill="#c48ba8"/>
    <g id="mouth-closed" stroke="#3a2c4e" stroke-width="4" fill="none"
       stroke-linecap="round">
      <path d="M 200 200 Q 190 212 180 206 M 200 200 Q 210 212 220 206"/>
    </g>
    <g id="mouth-closed-fangs" fill="#fff">
      <path d="M 190 203 l 5 0 l -2 12 Z"/><path d="M 210 203 l -5 0 l 2 12 Z"/>
    </g>
    <g id="mouth-open">
      <ellipse cx="200" cy="212" rx="16" ry="12" fill="#5a2436"/>
      <path d="M 190 203 l 5 0 l -2 11 Z" fill="#fff"/>
      <path d="M 210 203 l -5 0 l 2 11 Z" fill="#fff"/>
    </g>
  </g>

  <g id="sparkles" fill="#ffd97a">
    <path class="spark s1" d="M 322 74 l 4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
    <path class="spark s2" d="M 352 114 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
    <path class="spark s3" d="M 298 46 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
  </g>

  <g id="zzz" fill="#b592ff" font-family="Georgia, serif" font-weight="bold">
    <text class="z z1" x="296" y="96"  font-size="34">z</text>
    <text class="z z2" x="322" y="68"  font-size="26">z</text>
    <text class="z z3" x="344" y="46"  font-size="19">z</text>
  </g>
</svg>
