<svg xmlns="http://www.w3.org/2000/svg" id="familiar" viewBox="0 0 400 400" aria-label="Spider familiar">

  <style>
    /* What this creature looks like at rest.
     *
     * Inside the drawing rather than in shell.css beside it, because a shell
     * has to be right opened on its own -- in an &lt;img&gt;, in a browser tab,
     * in the shape picker on the hub -- and none of those load the stylesheet.
     * Without it a familiar renders with its closed eyes drawn on top of its
     * open ones, its mouth hanging open and its sleeping z's in the air.
     *
     * shell.css still wins wherever it has an opinion: every rule there is
     * prefixed with body[data-state=...], which outranks a bare selector. */
    .eyelid { transform: scaleY(0); }
    #closed-eyes, #sparkles, #zzz, #bubbles, #tongue { opacity: 0; }
    #mouth-open { visibility: hidden; }
  </style>

  <g id="legs">
    <g stroke="#3a3050" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path class="leg l1" d="M 132 246 L 70 206 L 34 232"/>
      <path class="leg l2" d="M 122 278 L 50 262 L 20 300"/>
      <path class="leg l3" d="M 126 308 L 58 320 L 40 364"/>
      <path class="leg l4" d="M 146 332 L 96 362 L 92 398"/>
    </g>
    <g stroke="#3a3050" stroke-width="15" stroke-linecap="round"
       stroke-linejoin="round" fill="none" transform="translate(400,0) scale(-1,1)">
      <path class="leg l1" d="M 132 246 L 70 206 L 34 232"/>
      <path class="leg l2" d="M 122 278 L 50 262 L 20 300"/>
      <path class="leg l3" d="M 126 308 L 58 320 L 40 364"/>
      <path class="leg l4" d="M 146 332 L 96 362 L 92 398"/>
    </g>
  </g>

  <ellipse class="edge" cx="200" cy="286" rx="104" ry="90" fill="#4a3d68"/>
  <path d="M 200 200 C 232 214, 250 250, 250 286 C 250 322, 232 356, 200 372
           C 168 356, 150 322, 150 286 C 150 250, 168 214, 200 200 Z"
        fill="#6b5a8f"/>
  <g fill="#e0c05a" opacity="0.9">
    <path d="M 200 226 l 16 26 -16 22 -16 -22 Z"/>
    <path d="M 200 292 l 13 22 -13 18 -13 -18 Z"/>
  </g>

  <g id="head">
    <ellipse class="edge" cx="200" cy="168" rx="72" ry="60" fill="#5a4a7a"/>
  <g class="eye" id="eye-left">
    <circle cx="174" cy="156" r="24" fill="#ffffff"/>
    <circle cx="174" cy="156" r="16" fill="#e0c05a"/>
    <g class="pupil">
      <ellipse cx="174" cy="156" rx="10" ry="10" fill="#14101f"/>
      <circle cx="179" cy="150" r="4" fill="#fff"/>
    </g>
    <circle class="eyelid" cx="174" cy="156" r="25" fill="#5a4a7a"/>
  </g>
  <g class="eye" id="eye-right">
    <circle cx="226" cy="156" r="24" fill="#ffffff"/>
    <circle cx="226" cy="156" r="16" fill="#e0c05a"/>
    <g class="pupil">
      <ellipse cx="226" cy="156" rx="10" ry="10" fill="#14101f"/>
      <circle cx="231" cy="150" r="4" fill="#fff"/>
    </g>
    <circle class="eyelid" cx="226" cy="156" r="25" fill="#5a4a7a"/>
  </g>
  <g id="closed-eyes" stroke="#2e2542" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 150 156 Q 174 170 198 156"/>
    <path d="M 202 156 Q 226 170 250 156"/>
  </g>
    <g id="small-eyes" fill="#2e2542">
      <circle cx="148" cy="142" r="7"/><circle cx="164" cy="126" r="6"/>
      <circle cx="252" cy="142" r="7"/><circle cx="236" cy="126" r="6"/>
      <circle cx="186" cy="118" r="5"/><circle cx="214" cy="118" r="5"/>
    </g>
    <g id="palps">
      <path d="M 168 200 C 156 220, 158 238, 172 244" stroke="#3a3050"
            stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M 232 200 C 244 220, 242 238, 228 244" stroke="#3a3050"
            stroke-width="9" fill="none" stroke-linecap="round"/>
    </g>
    <g id="mouth-closed" stroke="#2e2542" stroke-width="5" fill="none"
       stroke-linecap="round">
      <path d="M 184 200 Q 200 210 216 200"/>
    </g>
    <g id="mouth-open">
      <ellipse cx="200" cy="206" rx="16" ry="13" fill="#3a1f30"/>
      <path d="M 190 198 l 5 0 l -2 11 Z" fill="#e8e0f2"/>
      <path d="M 210 198 l -5 0 l 2 11 Z" fill="#e8e0f2"/>
    </g>
  </g>

  <g id="sparkles" fill="#ffd97a">
    <path class="spark s1" d="M 322 74 l 4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
    <path class="spark s2" d="M 352 114 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
    <path class="spark s3" d="M 298 46 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
  </g>

  <g id="zzz" fill="#b592ff" font-family="Georgia, serif" font-weight="bold">
    <text class="z z1" x="296" y="96"  font-size="34">z</text>
    <text class="z z2" x="322" y="68"  font-size="26">z</text>
    <text class="z z3" x="344" y="46"  font-size="19">z</text>
  </g>
</svg>
