<svg xmlns="http://www.w3.org/2000/svg" id="familiar" viewBox="0 0 400 400" aria-label="Crab familiar">

  <style>
    /* What this creature looks like at rest.
     *
     * Inside the drawing rather than in shell.css beside it, because a shell
     * has to be right opened on its own -- in an &lt;img&gt;, in a browser tab,
     * in the shape picker on the hub -- and none of those load the stylesheet.
     * Without it a familiar renders with its closed eyes drawn on top of its
     * open ones, its mouth hanging open and its sleeping z's in the air.
     *
     * shell.css still wins wherever it has an opinion: every rule there is
     * prefixed with body[data-state=...], which outranks a bare selector. */
    .eyelid { transform: scaleY(0); }
    #closed-eyes, #sparkles, #zzz, #bubbles, #tongue { opacity: 0; }
    #mouth-open { visibility: hidden; }
  </style>

  <g id="legs">
    <g stroke="#c0442e" stroke-width="11" stroke-linecap="round" fill="none">
      <path class="leg l1" d="M 118 286 C 84 292, 62 310, 54 332"/>
      <path class="leg l2" d="M 116 306 C 82 318, 66 338, 62 358"/>
      <path class="leg l3" d="M 124 324 C 100 342, 92 358, 92 372"/>
    </g>
    <g stroke="#c0442e" stroke-width="11" stroke-linecap="round" fill="none"
       transform="translate(400,0) scale(-1,1)">
      <path class="leg l1" d="M 118 286 C 84 292, 62 310, 54 332"/>
      <path class="leg l2" d="M 116 306 C 82 318, 66 338, 62 358"/>
      <path class="leg l3" d="M 124 324 C 100 342, 92 358, 92 372"/>
    </g>
  </g>

  <g id="claw-left" class="claw">
    <path d="M 120 250 C 92 250, 76 236, 74 216" stroke="#c0442e"
          stroke-width="13" fill="none" stroke-linecap="round"/>
    <path class="edge" d="M 74 214 C 46 196, 22 206, 20 228 C 18 250, 40 262, 62 254
             C 56 244, 58 232, 74 226 Z" fill="#e05a3c"/>
    <path class="edge" d="M 62 254 C 44 268, 46 286, 62 290 C 76 292, 84 278, 76 262 Z"
          fill="#f07a5c"/>
  </g>
  <g transform="translate(400,0) scale(-1,1)">
    <g id="claw-right" class="claw">
      <path d="M 120 250 C 92 250, 76 236, 74 216" stroke="#c0442e"
            stroke-width="13" fill="none" stroke-linecap="round"/>
      <path class="edge" d="M 74 214 C 46 196, 22 206, 20 228 C 18 250, 40 262, 62 254
               C 56 244, 58 232, 74 226 Z" fill="#e05a3c"/>
      <path class="edge" d="M 62 254 C 44 268, 46 286, 62 290 C 76 292, 84 278, 76 262 Z"
            fill="#f07a5c"/>
    
    </g>
  </g>

  <g id="stalk-left" class="stalk">
    <path d="M 172 200 L 166 128" stroke="#c0442e" stroke-width="10"
          stroke-linecap="round" fill="none"/>
  </g>
  <g transform="translate(400,0) scale(-1,1)">
    <g id="stalk-right" class="stalk">
      <path d="M 172 200 L 166 128" stroke="#c0442e" stroke-width="10"
            stroke-linecap="round" fill="none"/>
    
    </g>
  </g>

  <path class="edge" d="M 200 152 C 272 152, 316 196, 316 250 C 316 306, 268 336, 200 336
           C 132 336, 84 306, 84 250 C 84 196, 128 152, 200 152 Z"
        fill="#e05a3c"/>
  <path d="M 200 172 C 258 172, 294 202, 296 244 C 262 232, 232 228, 200 228
           C 168 228, 138 232, 104 244 C 106 202, 142 172, 200 172 Z"
        fill="#f07a5c"/>
  <g fill="#c0442e">
    <ellipse cx="146" cy="284" rx="12" ry="8"/><ellipse cx="254" cy="284" rx="12" ry="8"/>
    <ellipse cx="200" cy="300" rx="14" ry="9"/>
  </g>

  <g class="eye" id="eye-left">
    <circle cx="166" cy="122" r="24" fill="#ffffff"/>
    <g class="pupil">
      <ellipse cx="166" cy="122" rx="12" ry="12" fill="#14101f"/>
      <circle cx="172" cy="115" r="4" fill="#fff"/>
    </g>
    <circle class="eyelid" cx="166" cy="122" r="25" fill="#e05a3c"/>
  </g>
  <g class="eye" id="eye-right">
    <circle cx="234" cy="122" r="24" fill="#ffffff"/>
    <g class="pupil">
      <ellipse cx="234" cy="122" rx="12" ry="12" fill="#14101f"/>
      <circle cx="240" cy="115" r="4" fill="#fff"/>
    </g>
    <circle class="eyelid" cx="234" cy="122" r="25" fill="#e05a3c"/>
  </g>
  <g id="closed-eyes" stroke="#8f2f1e" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 142 122 Q 166 136 190 122"/>
    <path d="M 210 122 Q 234 136 258 122"/>
  </g>
  <g id="mouth-closed" stroke="#8f2f1e" stroke-width="5" fill="none"
     stroke-linecap="round">
    <path d="M 178 268 Q 200 282 222 268"/>
  </g>
  <g id="mouth-open">
    <path d="M 176 264 Q 200 300 224 264 Z" fill="#7a2418"/>
    <g fill="#ffffff" opacity="0.95">
      <path d="M 186 268 l 8 0 l -4 8 Z"/><path d="M 214 268 l -8 0 l 4 8 Z"/>
    </g>
  </g>

  <g id="sparkles" fill="#ffd97a">
    <path class="spark s1" d="M 322 74 l 4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z"/>
    <path class="spark s2" d="M 352 114 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
    <path class="spark s3" d="M 298 46 l 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z"/>
  </g>

  <g id="zzz" fill="#b592ff" font-family="Georgia, serif" font-weight="bold">
    <text class="z z1" x="296" y="96"  font-size="34">z</text>
    <text class="z z2" x="322" y="68"  font-size="26">z</text>
    <text class="z z3" x="344" y="46"  font-size="19">z</text>
  </g>
</svg>
