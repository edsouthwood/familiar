<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The den</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/button.css">
<link rel="stylesheet" href="/field.css">
<link rel="stylesheet" href="/page.css">
<script src="/theme.js"></script>
</head>
<body>

<main class="sheet wide">
  <div class="row" style="justify-content: space-between; align-items: baseline;">
    <h1>The den</h1>
    <button id="sign-out" class="secondary" type="button">Sign out</button>
  </div>
  <p class="subtitle" id="who"></p>

  <ul class="tables" id="tables"></ul>
  <p class="empty" id="empty" hidden>No tables yet. Make one below and your
    familiar will be waiting when you sit down.</p>

  <details id="new-table">
    <summary>Start a new table</summary>
    <form id="form">
      <label>What is this campaign called?
        <input id="name" type="text" maxlength="80" required>
      </label>
      <label>What should the familiar be called?
        <input id="familiar" type="text" maxlength="60" placeholder="Whiskers">
      </label>
      <label>Short name for the URL <span class="note">(optional)</span>
        <input id="slug" type="text" maxlength="40" pattern="[a-zA-Z0-9-]*"
               placeholder="thursday-game">
      </label>
      <button type="submit">Create the table</button>
      <p class="error" id="error"></p>
    </form>
  </details>
</main>

<script src="/account.js"></script>
<script src="/usage-view.js"></script>
<script src="/den.js"></script>
</body>
</html>
