<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/button.css">
<link rel="stylesheet" href="/field.css">
<link rel="stylesheet" href="/page.css">
<script src="/theme.js"></script>
</head>
<body>

<main class="sheet">
  <h1>Sign in</h1>
  <p class="subtitle">Your familiars are waiting.</p>

  <form id="form">
    <label>Email
      <input id="email" type="email" autocomplete="email" required>
    </label>
    <label>Password
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <button type="submit">Sign in</button>
    <p class="error" id="error"></p>
  </form>

  <p class="alt">No account yet? <a href="/signup.html">Make one</a>.</p>
  <p class="alt note">Players don't need an account &mdash; ask your DM for the
    invitation link.</p>
</main>

<script src="/account.js"></script>
<script>
  bindAuthForm("/api/login", () => ({
    email: byId("email").value.trim(),
    password: byId("password").value,
  }));
</script>
</body>
</html>
